name: Build Vortex Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.1.10909125
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      
      - name: Unset conflicting Android env vars
        run: |
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
        shell: bash
      
      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.1.10909125
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vortex-src/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-
      
      - name: Extract AppImage Assets (if available)
        run: |
          if [ -f "$APPIMAGE_PATH" ]; then
            ./scripts/extract.sh
          else
            echo "AppImage not found at $APPIMAGE_PATH, skipping asset extraction"
            echo "Using existing assets in app/src/main/assets/"
          fi
        env:
          APPIMAGE_PATH: ${{ github.workspace }}/Vortex-linux-x86_64.AppImage
        continue-on-error: true
      
      - name: Build Rust for Android
        run: |
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
          ./scripts/build_rust.sh
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.1.10909125
      
      - name: Bundle Libraries
        run: |
          ./scripts/bundle.sh
        working-directory: ${{ github.workspace }}
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build Debug APK
        run: |
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          unset ANDROID_HOME
          ./gradlew assembleDebug --no-daemon
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.1.10909125
      
      - name: Build Release APK
        run: |
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          unset ANDROID_HOME
          ./gradlew assembleRelease --no-daemon
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.1.10909125
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vortex-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vortex-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      
      - name: Upload Build Info
        run: |
          echo "Build completed successfully"
          echo "Debug APK: $(ls -la app/build/outputs/apk/debug/app-debug.apk)"
          echo "Release APK: $(ls -la app/build/outputs/apk/release/app-release.apk 2>/dev/null || echo 'Not built')"
